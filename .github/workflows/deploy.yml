name: Deploy CA Buddy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish verified artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
